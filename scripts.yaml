pc_ratti_starten:
  alias: Guten Morgen
  description: ""
  mode: single
  sequence:
    - action: switch.turn_on
      target:
        entity_id: switch.tm_beastpc
    - choose:
        - conditions:
            - condition: template
              value_template: "{{ state_attr('sun.sun', 'elevation') > 0 }}"
          sequence:
            - action: switch.turn_on
              target:
                entity_id: switch.tm_rattihome
        - conditions:
            - condition: template
              value_template: "{{ now().hour < 12 and state_attr('sun.sun', 'elevation') <= 0 }}"
          sequence:
            - action: light.turn_on
              target:
                entity_id: light.wohnzimmer
            - wait_for_trigger:
                - trigger: sun
                  event: sunrise
            - action: light.turn_off
              target:
                entity_id: light.wohnzimmer
            - action: switch.turn_on
              target:
                entity_id: switch.tm_rattihome
