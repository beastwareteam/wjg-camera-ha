- id: '1777301668452'
  alias: Kühlschrank Steuerung PRO (Tasmota Smart)
  description: ''
  triggers:
  - event: start
    trigger: homeassistant
  actions:
  - repeat:
      while: []
      sequence:
      - variables:
          temp: "{{ state_attr('weather.forecast_home', 'temperature') | float(15) }}"
          is_day: "{{ now().hour >= 6 and now().hour < 22 }}"
      - wait_template: >
          {{ (as_timestamp(now()) - as_timestamp(states.switch.tm_kuhlschrank.last_changed)) > 600 }}
      - choose:
        - conditions:
          - condition: template
            value_template: '{{ temp < 10 }}'
          sequence:
          - variables:
              an: >
                {{ states('input_number.ks_kalt_an_tag') | int(60) if is_day
                   else states('input_number.ks_kalt_an_nacht') | int(60) }}
              aus: >
                {{ states('input_number.ks_kalt_aus_tag') | int(120) if is_day
                   else states('input_number.ks_kalt_aus_nacht') | int(120) }}
        - conditions:
          - condition: template
            value_template: '{{ temp >= 10 and temp <= 20 }}'
          sequence:
          - variables:
              an: >
                {{ states('input_number.ks_mild_an_tag') | int(90) if is_day
                   else states('input_number.ks_mild_an_nacht') | int(90) }}
              aus: >
                {{ states('input_number.ks_mild_aus_tag') | int(90) if is_day
                   else states('input_number.ks_mild_aus_nacht') | int(90) }}
        - conditions:
          - condition: template
            value_template: '{{ temp > 20 }}'
          sequence:
          - variables:
              an: >
                {{ states('input_number.ks_heiss_an_tag') | int(120) if is_day
                   else states('input_number.ks_heiss_an_nacht') | int(120) }}
              aus: >
                {{ states('input_number.ks_heiss_aus_tag') | int(60) if is_day
                   else states('input_number.ks_heiss_aus_nacht') | int(60) }}
      - target:
          entity_id: switch.tm_kuhlschrank
        action: switch.turn_on
      # FIX: float(0) statt float – verhindert Crash bei unavailable
      - wait_template: >
          {{ states('sensor.tm_kuhlschrank_energy_power') | float(0) > 50 }}
        timeout: '00:10:00'
        continue_on_timeout: true
      - wait_template: >
          {{ states('sensor.tm_kuhlschrank_energy_power') | float(0) < 25 }}
        timeout: '03:00:00'
        continue_on_timeout: true
      - target:
          entity_id: switch.tm_kuhlschrank
        action: switch.turn_off
      - delay:
          minutes: '{{ aus }}'
  mode: single

- id: '1777302284734'
  alias: Kühlschrank Sensor Fehler
