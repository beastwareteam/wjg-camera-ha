- id: '1777234764180'
  alias: Kühlschrank Hitze - Tag
  description: ''
  triggers:
  - trigger: time_pattern
    hours: /2
  - trigger: numeric_state
    entity_id: weather.forecast_home
    attribute: temperature
    above: 20
  conditions:
  - condition: numeric_state
    entity_id: weather.forecast_home
    attribute: temperature
    above: 20
  - condition: time
    after: '06:00:00'
    before: '22:00:00'
  actions:
  - action: switch.turn_on
    target:
      entity_id: switch.tm_kuhlschrank
  - delay: '02:00:00'
  - action: switch.turn_off
    target:
      entity_id: switch.tm_kuhlschrank
  - delay: '01:00:00'
  mode: restart

