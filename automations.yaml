- id: wjg_kamera_bewegungsaufnahme
  alias: "WJG Kamera: Bewegungsaufnahme"
  description: "Startet HA-native Aufnahme bei Bewegungserkennung (Backup zur Coordinator-Aufnahme)"
  mode: restart
  triggers:
    - platform: state
      entity_id: binary_sensor.wjg_xm_3820_bewegung
      to: "on"
  actions:
    - service: camera.record
      target:
        entity_id: camera.wjg_xm_3820
      data:
        filename: "/media/camera/ha_motion_{{ now().strftime('%Y%m%d_%H%M%S') }}.mp4"
        duration: 120
        lookback: 2

- id: '1777229948150'
  alias: Alarm - Beast Zombie (alle 3 Tage)
  description: Ab 26.04. alle 3 Tage um 16:00, bei Samstag auf Sonntag verschoben
  triggers:
  - at: '16:00:00'
    trigger: time
  conditions:
  - condition: template
    value_template: >
      {% set days_since = ((as_timestamp(now().replace(hour=0, minute=0, second=0,
        microsecond=0)) - as_timestamp('2026-04-26')) / 86400) | int %}
      {% set weekday = now().weekday() %}
      {% if weekday == 6 %}
        {{ ((days_since - 1) % 3) == 0 }}
      {% else %}
        {{ (days_since % 3 == 0) and weekday != 5 }}
      {% endif %}
  actions:
  - variables:
      licht_war_an: "{{ is_state('light.wohnzimmer', 'on') }}"
      alte_helligkeit: "{{ state_attr('light.wohnzimmer', 'brightness') | default(255) }}"
  - data:
      message: command_screen_on
    action: notify.mobile_app_homies_tablet_i10
  - target:
      entity_id: light.wohnzimmer
    data:
      rgb_color:
      - 0
      - 204
      - 255
      brightness: 255
    action: light.turn_on
  - data:
      title: ⏰ Beast Zombie!
      message: Jetzt starten!
      data:
        channel: silent_alarm
        silent: true
        clickAction: app://com.fun.lastwar.gp
    action: notify.mobile_app_homies_tablet_i10
  - delay:
      seconds: 3
  - if:
    - condition: template
      value_template: '{{ licht_war_an }}'
    then:
    - target:
        entity_id: light.wohnzimmer
      data:
        brightness: '{{ alte_helligkeit }}'
        color_temp_kelvin: 2700
      action: light.turn_on
    else:
    - target:
        entity_id: light.wohnzimmer
      action: light.turn_off

