- id: '1777230945997'
  alias: Abendbeleuchtung
  description: Steuert Wohnzimmerlichter basierend auf Sonnenuntergang
  triggers:
  - event: sunset
    offset: '-00:30:00'
    id: vor_sonnenuntergang
    trigger: sun
  - event: sunset
    offset: '00:30:00'
    id: nach_sonnenuntergang
    trigger: sun
  - event: sunset
    offset: '01:00:00'
    id: eine_stunde_nach
    trigger: sun
  actions:
  - choose:
    - conditions:
      - condition: trigger
        id: vor_sonnenuntergang
      sequence:
      - target:
          entity_id:
          - light.wohnzimmer
          - light.wohnzimmerdecke
        data:
          hs_color: >
            {% set colors = {
              'red': [0, 100],
              'green': [120, 100],
              'blue': [240, 100],
              'yellow': [60, 100],
              'purple': [280, 100],
              'orange': [30, 100],
              'pink': [330, 100],
              'white': [0, 0]
            } %}
            {{ colors[states('input_select.lieblingsfarbe_wohnzimmer')] }}
        action: light.turn_on
    - conditions:
      - condition: trigger
        id: nach_sonnenuntergang
      sequence:
      - target:
          entity_id:
          - light.wohnzimmer
          - light.wohnzimmerdecke
        data:
          brightness_pct: 1
          hs_color: >
            {% set colors = {
              'red': [0, 100],
              'green': [120, 100],
              'blue': [240, 100],
              'yellow': [60, 100],
              'purple': [280, 100],
              'orange': [30, 100],
              'pink': [330, 100],
              'white': [0, 0]
            } %}
            {{ colors[states('input_select.lieblingsfarbe_wohnzimmer')] }}
        action: light.turn_on
    - conditions:
      - condition: trigger
        id: eine_stunde_nach
      sequence:
      - target:
          entity_id:
          - light.wohnzimmer
          - light.wohnzimmerdecke
        data:
          brightness_pct: 20
          hs_color: >
            {% set colors = {
              'red': [0, 100],
              'green': [120, 100],
              'blue': [240, 100],
              'yellow': [60, 100],
              'purple': [280, 100],
              'orange': [30, 100],
              'pink': [330, 100],
              'white': [0, 0]
            } %}
            {{ colors[states('input_select.lieblingsfarbe_wohnzimmer')] }}
        action: light.turn_on
  mode: single

