  actions:
  - data:
      title: Kühlschrank Warnung
      message: Kühlschrank war über 3,5 Stunden aus – wird jetzt automatisch eingeschaltet!
    action: persistent_notification.create
  - target:
      entity_id: switch.tm_kuhlschrank
    action: switch.turn_on
  mode: single

