title: WJG Kamera
path: wjg-kamera
icon: mdi:cctv
views:
  - title: Live
    path: live
    icon: mdi:video
    badges:
      - entity: binary_sensor.wjg_xm_3820_bewegung
        name: Bewegung
      - entity: binary_sensor.wjg_xm_3820_manipulation
        name: Tamper
      - entity: binary_sensor.wjg_xm_3820_signalverlust
        name: Signal
      - entity: switch.wjg_xm_3820_aufnahme
        name: Aufnahme
    cards:
      # ── Kamera-Stream (einzig! ersetzt picture-glance) ───────────────────
      # Zoom: Mausrad, Pinch-Zoom, Preset-Buttons, Resize-Handles an Kanten
      - type: custom:wjg-camera-card
        entity: camera.wjg_xm_3820
        title: WJG XM-3820 Live
        badges:
          - entity: binary_sensor.wjg_xm_3820_bewegung
            icon: mdi:motion-sensor
          - entity: binary_sensor.wjg_xm_3820_manipulation
            icon: mdi:shield-alert
          - entity: switch.wjg_xm_3820_aufnahme
            icon: mdi:record-circle

      # ── PTZ-Steuerung ────────────────────────────────────────────────────
      - square: false
        type: grid
        title: PTZ-Steuerung
        columns: 3
        cards:
          - type: button
            icon: mdi:home-map-marker
            name: Home
            tap_action:
              action: call-service
              service: button.press
              target:
                entity_id: button.wjg_xm_3820_ptz_home
          - type: button
            icon: mdi:arrow-up-bold-circle
            name: Hoch
            tap_action:
              action: call-service
              service: button.press
              target:
                entity_id: button.wjg_xm_3820_ptz_up
          - type: button
            icon: mdi:magnify-plus
            name: Zoom +
            tap_action:
              action: call-service
              service: button.press
              target:
                entity_id: button.wjg_xm_3820_ptz_zoom_in
          - type: button
            icon: mdi:arrow-left-bold-circle
            name: Links
            tap_action:
              action: call-service
              service: button.press
              target:
                entity_id: button.wjg_xm_3820_ptz_left
          - type: button
            icon: mdi:stop-circle
            name: Stopp
            tap_action:
              action: call-service
              service: button.press
              target:
                entity_id: button.wjg_xm_3820_ptz_stopp
          - type: button
            icon: mdi:arrow-right-bold-circle
            name: Rechts
            tap_action:
              action: call-service
              service: button.press
              target:
                entity_id: button.wjg_xm_3820_ptz_right
          - type: button
            icon: mdi:arrow-down-bold-circle
            name: Runter
            tap_action:
              action: call-service
              service: button.press
              target:
                entity_id: button.wjg_xm_3820_ptz_down
          - type: button
            icon: mdi:home-edit
            name: Home setzen
            tap_action:
              action: call-service
              service: button.press
              target:
                entity_id: button.wjg_xm_3820_ptz_home_setzen
          - type: button
            icon: mdi:magnify-minus
            name: Zoom -
            tap_action:
              action: call-service
              service: button.press
              target:
                entity_id: button.wjg_xm_3820_ptz_zoom_out

      # ── Schnellaktionen ──────────────────────────────────────────────────
      - type: horizontal-stack
        cards:
          - type: button
            name: Snapshot
            icon: mdi:camera-iris
            tap_action:
              action: call-service
              service: button.press
              target:
                entity_id: button.wjg_xm_3820_snapshot
          - type: button
            name: Aufnahme EIN
            icon: mdi:record
            tap_action:
              action: call-service
              service: switch.turn_on
              target:
                entity_id: switch.wjg_xm_3820_aufnahme
          - type: button
            name: Aufnahme AUS
            icon: mdi:stop
            tap_action:
              action: call-service
              service: switch.turn_off
              target:
                entity_id: switch.wjg_xm_3820_aufnahme

      # ── Status-Entities ──────────────────────────────────────────────────
      - type: horizontal-stack
        cards:
          - type: entity
            entity: switch.wjg_xm_3820_aufnahme
            name: Aufnahme
            icon: mdi:record-circle
            state_color: true
            tap_action:
              action: toggle
          - type: entity
            entity: binary_sensor.wjg_xm_3820_bewegung
            name: Bewegung
            state_color: true
          - type: entity
            entity: binary_sensor.wjg_xm_3820_manipulation
            name: Tamper
            state_color: true
          - type: entity
            entity: binary_sensor.wjg_xm_3820_signalverlust
            name: Signal
            state_color: true

  - title: PTZ
    path: ptz
    icon: mdi:camera-control
    cards:
      - type: grid
        title: PTZ-Steuerung
        columns: 3
        square: true
        cards:
