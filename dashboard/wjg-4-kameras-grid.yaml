# ============================================================================
#  WJG XM-3820 — 4 Kameras im 2×2-Grid
# ============================================================================
#  Voraussetzung:
#   1. Lovelace-Ressource registriert:
#        Einstellungen → Dashboards → Ressourcen → + Hinzufügen
#        URL:  /wjg_camera/wjg-camera-card.js     Typ: JavaScript-Modul
#   2. Alle 4 Kameras als eigene Integration-Einträge hinzugefügt
#        (Einstellungen → Geräte & Dienste → Integration hinzufügen → WJG Camera,
#         für jede der 4 IP-Adressen einmal).
#
#  WICHTIG — Entity-IDs anpassen:
#  Bei 4 identischen Kameras vergibt HA automatisch Suffixe (_2, _3, _4).
#  EMPFEHLUNG: Benenne jede Kamera in HA um (Gerät → ⚙ → Umbenennen, z. B.
#  "Hof", "Einfahrt", "Garten", "Garage"). Dann werden die Entity-IDs sauber
#  (camera.hof, button.hof_ptz_up …) statt camera.wjg_xm_3820_2 usw.
#
#  Prüfe deine echten IDs unter:  Entwicklerwerkzeuge → Zustände → Filter "wjg"
#  und ersetze unten die camera.* / button.* / binary_sensor.* / switch.* IDs.
# ============================================================================

# Diese Datei beschreibt EINE View (ein Reiter im Dashboard).
# Einbau: entweder als Inhalt eines Eintrags unter "views:" deines Dashboards,
# oder den "cards:"-Block in eine bestehende View kopieren.
title: WJG Kameras
path: wjg-kameras
icon: mdi:cctv
cards:
  - type: grid
    columns: 2          # 2 Spalten → 2×2 bei 4 Karten
    square: false
    cards:

      # ── Kamera 1 ───────────────────────────────────────────────────────
      - type: custom:wjg-camera-card
        entity: camera.wjg_xm_3820
        title: Kamera 1
        show_ptz: true
        show_zoom_bar: true
        aspect_ratio: "16/9"
        ptz_speed_entity: number.wjg_xm_3820_ptz_geschwindigkeit
        ptz_entities:
          up:       button.wjg_xm_3820_ptz_up
          down:     button.wjg_xm_3820_ptz_down
          left:     button.wjg_xm_3820_ptz_left
          right:    button.wjg_xm_3820_ptz_right
          home:     button.wjg_xm_3820_ptz_home
          zoom_in:  button.wjg_xm_3820_ptz_zoom_in
          zoom_out: button.wjg_xm_3820_ptz_zoom_out
        badges:
          - entity: binary_sensor.wjg_xm_3820_bewegung
            icon: mdi:motion-sensor
          - entity: switch.wjg_xm_3820_aufnahme
            icon: mdi:record-circle
            action: switch.toggle

      # ── Kamera 2 ───────────────────────────────────────────────────────
      - type: custom:wjg-camera-card
        entity: camera.wjg_xm_3820_2
        title: Kamera 2
        show_ptz: true
        show_zoom_bar: true
        aspect_ratio: "16/9"
        ptz_speed_entity: number.wjg_xm_3820_ptz_geschwindigkeit_2
        ptz_entities:
          up:       button.wjg_xm_3820_ptz_up_2
          down:     button.wjg_xm_3820_ptz_down_2
          left:     button.wjg_xm_3820_ptz_left_2
          right:    button.wjg_xm_3820_ptz_right_2
          home:     button.wjg_xm_3820_ptz_home_2
          zoom_in:  button.wjg_xm_3820_ptz_zoom_in_2
          zoom_out: button.wjg_xm_3820_ptz_zoom_out_2
        badges:
          - entity: binary_sensor.wjg_xm_3820_bewegung_2
            icon: mdi:motion-sensor
          - entity: switch.wjg_xm_3820_aufnahme_2
            icon: mdi:record-circle
            action: switch.toggle

      # ── Kamera 3 ───────────────────────────────────────────────────────
      - type: custom:wjg-camera-card
        entity: camera.wjg_xm_3820_3
        title: Kamera 3
        show_ptz: true
        show_zoom_bar: true
        aspect_ratio: "16/9"
        ptz_speed_entity: number.wjg_xm_3820_ptz_geschwindigkeit_3
        ptz_entities:
          up:       button.wjg_xm_3820_ptz_up_3
          down:     button.wjg_xm_3820_ptz_down_3
          left:     button.wjg_xm_3820_ptz_left_3
          right:    button.wjg_xm_3820_ptz_right_3
          home:     button.wjg_xm_3820_ptz_home_3
          zoom_in:  button.wjg_xm_3820_ptz_zoom_in_3
          zoom_out: button.wjg_xm_3820_ptz_zoom_out_3
        badges:
          - entity: binary_sensor.wjg_xm_3820_bewegung_3
            icon: mdi:motion-sensor
          - entity: switch.wjg_xm_3820_aufnahme_3
            icon: mdi:record-circle
            action: switch.toggle

      # ── Kamera 4 ───────────────────────────────────────────────────────
      - type: custom:wjg-camera-card
        entity: camera.wjg_xm_3820_4
        title: Kamera 4
        show_ptz: true
        show_zoom_bar: true
        aspect_ratio: "16/9"
        ptz_speed_entity: number.wjg_xm_3820_ptz_geschwindigkeit_4
        ptz_entities:
          up:       button.wjg_xm_3820_ptz_up_4
          down:     button.wjg_xm_3820_ptz_down_4
          left:     button.wjg_xm_3820_ptz_left_4
          right:    button.wjg_xm_3820_ptz_right_4
          home:     button.wjg_xm_3820_ptz_home_4
