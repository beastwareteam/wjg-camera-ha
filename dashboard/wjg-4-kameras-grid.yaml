# ============================================================================
#  WJG XM-3820 — Kameras im 2×2-Grid  (vollständig getrennt pro Kamera)
# ============================================================================
#  Voraussetzung:
#   1. Card-Version >= 2.2.36 als Lovelace-Ressource registriert:
#        Einstellungen → Dashboards → Ressourcen
#        URL:  /wjg_camera/wjg-camera-card.js     Typ: JavaScript-Modul
#      Nach Update: Browser-Cache leeren / Strg+F5.
#   2. Jede Kamera als eigener WJG-Camera-Eintrag, eindeutig benannt.
#
#  Pro Karte genügt `entity: camera.<kamera>`. Die Karte löst PTZ-Buttons UND die
#  PTZ-Geschwindigkeit automatisch aus DEMSELBEN Gerät auf (Entity-Registry) —
#  jeder Slider/Button steuert garantiert nur SEINE Kamera, keine Querverbindung.
#
#  Konfiguriert für: cam_eingang · cam_dachboden · cam_schlafzimmer
# ============================================================================

# Diese Datei beschreibt EINE View (ein Reiter). Einbau: als Eintrag unter
# "views:" deines Dashboards, oder den "cards:"-Block in eine View kopieren.
title: WJG Kameras
path: wjg-kameras
icon: mdi:cctv
cards:
  - type: grid
    columns: 2          # 2 Spalten → 2×2-Raster
    square: false
    cards:

      # ── Eingang ────────────────────────────────────────────────────────
      - type: custom:wjg-camera-card
        entity: camera.cam_eingang
        title: Eingang
        show_ptz: true
        show_zoom_bar: true
        aspect_ratio: "16/9"
        badges:
          - entity: binary_sensor.cam_eingang_bewegung
            icon: mdi:motion-sensor
          - entity: switch.cam_eingang_aufnahme
            icon: mdi:record-circle
            action: switch.toggle

      # ── Dachboden ──────────────────────────────────────────────────────
      - type: custom:wjg-camera-card
        entity: camera.cam_dachboden
        title: Dachboden
        show_ptz: true
        show_zoom_bar: true
        aspect_ratio: "16/9"
        badges:
          - entity: binary_sensor.cam_dachboden_bewegung
            icon: mdi:motion-sensor
          - entity: switch.cam_dachboden_aufnahme
            icon: mdi:record-circle
            action: switch.toggle

      # ── Schlafzimmer ───────────────────────────────────────────────────
      - type: custom:wjg-camera-card
        entity: camera.cam_schlafzimmer
        title: Schlafzimmer
        show_ptz: true
        show_zoom_bar: true
        aspect_ratio: "16/9"
        badges:
          - entity: binary_sensor.cam_schlafzimmer_bewegung
            icon: mdi:motion-sensor
          - entity: switch.cam_schlafzimmer_aufnahme
            icon: mdi:record-circle
            action: switch.toggle

      # ── 4. Kamera (optional) ───────────────────────────────────────────
      # Wenn die 4. Kamera eingerichtet ist: entity-Zeile (und Badge-Slugs)
      # auf deren Slug setzen und die Kommentarzeichen entfernen.
      # - type: custom:wjg-camera-card
      #   entity: camera.KAMERA_4
      #   title: Kamera 4
      #   show_ptz: true
      #   show_zoom_bar: true
      #   aspect_ratio: "16/9"
      #   badges:
      #     - entity: binary_sensor.KAMERA_4_bewegung
      #       icon: mdi:motion-sensor
      #     - entity: switch.KAMERA_4_aufnahme
      #       icon: mdi:record-circle
      #       action: switch.toggle
