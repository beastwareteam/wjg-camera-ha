set_digital_zoom:
  name: Digitalen Zoom setzen
  description: >
    Setzt den digitalen Zoom der WJG-Kamera auf einen bestimmten Faktor
    und optional auf einen Bildmittelpunkt.
  fields:
    entity_id:
      name: Kamera-Entity
      description: Die Kamera-Entity auf die der Zoom angewendet wird.
      required: true
      selector:
        entity:
          domain: camera
    zoom:
      name: Zoom-Faktor
      description: Zoom-Stufe zwischen 1.0 (kein Zoom) und 10.0 (maximaler Zoom).
      required: true
      default: 1.0
      selector:
        number:
          min: 1.0
          max: 10.0
          step: 0.5
          mode: slider
    cx:
      name: Bildmitte X
      description: >
        Horizontaler Mittelpunkt des Zooms (0.0 = ganz links, 1.0 = ganz rechts).
        Standard ist 0.5 (Bildmitte).
      required: false
      default: 0.5
      selector:
        number:
          min: 0.0
          max: 1.0
          step: 0.05
          mode: slider
    cy:
      name: Bildmitte Y
      description: >
        Vertikaler Mittelpunkt des Zooms (0.0 = ganz oben, 1.0 = ganz unten).
        Standard ist 0.5 (Bildmitte).
      required: false
      default: 0.5
      selector:
        number:
          min: 0.0
          max: 1.0
          step: 0.05
          mode: slider

simulate_motion:
  name: Bewegung simulieren (Test)
  description: >
    Löst denselben Ablauf wie eine echte Bewegungserkennung aus (Cooldown,
    Backoff, automatische Aufnahme falls aktiviert), ohne auf reale
    Kamera-Bewegung warten zu müssen. Zum gezielten Testen der
    Auto-Aufnahme-Pipeline.
  fields:
    entity_id:
      name: Kamera-Entity
      description: Die Kamera-Entity, für die Bewegung simuliert werden soll.
      required: true
      selector:
        entity:
          domain: camera

ptz_test:
  name: PTZ-Test (Diagnose)
  description: >
    Prüft, ob die Kamera kurze Schwenks selbst begrenzen kann. Die Antwort
    erscheint direkt unter dem Aktions-Aufruf. Kamera beim Test beobachten:
    "relative" fährt eine feste Strecke ohne Stop, "timeout" soll nach
    "Wert" Sekunden selbst anhalten (Sicherheits-Stop 3 s später),
    "continuous" ist das heutige Verfahren zum Vergleich.
  fields:
    entity_id:
      name: Kamera-Entity
      description: Die Kamera-Entity, die getestet wird.
      required: true
      selector:
        entity:
          domain: camera
    direction:
      name: Richtung
      required: true
      default: right
      selector:
        select:
          options:
            - left
            - right
            - up
            - down
    method:
      name: Methode
      required: true
      default: relative
      selector:
        select:
          options:
            - relative
            - timeout
            - continuous
    value:
      name: Wert
      description: >
        relative = Strecke (0.01 winzig … höchstens 1.0 groß),
        timeout/continuous = Sekunden (bis 5.0).
      required: true
      default: 0.05
      selector:
        number:
          min: 0.01
          max: 5.0
          step: 0.01
          mode: box

patrol_test_station:
  name: "Patrouille: Station testen"
  description: >
    Fährt eine Position an, um die Werte für die Stationsliste der Patrouille
    zu finden: erst an den linken (und bei Neigung oberen) Anschlag, dann
    "rechts/runter" in Klicks Stufe 8 – Kommazahlen erlaubt, z. B. 3.5/1.2.
    Eine laufende Patrouille pausiert dabei 5 Minuten.
  fields:
    entity_id:
      name: Kamera-Entity
      required: true
      selector:
        entity:
          domain: camera
    station:
      name: Station
      description: 'rechts oder rechts/runter, z. B. 3.5/1.2 (Punkt als Dezimalzeichen)'
      required: true
      example: "3.5/1.2"
      selector:
        text:
