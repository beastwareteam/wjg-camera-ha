# WJG XM-3820 Kamera Dashboard für Home Assistant Lovelace
# ============================================================
# Einfügen unter: Einstellungen → Dashboards → Neues Dashboard
# oder in /config/lovelace/dashboards/kamera.yaml
#
# Voraussetzungen (über HACS installieren):
#   - frigate              (optional, für erweiterte Funktionen)
#   - mushroom-cards       (schönes UI)
#   - button-card          (PTZ-Steuerung)
#   - mini-media-player    (optional)

title: "Kamera-Überwachung"
path: kamera
icon: mdi:cctv
background: var(--lovelace-background)

views:
  - title: Übersicht
    path: uebersicht
    icon: mdi:home-outline
    badges: []
    cards:

      # ───────────────────────────────────────────────
      # 1) LIVESTREAM (obere Reihe, volle Breite)
      # ───────────────────────────────────────────────
      - type: picture-glance
        title: WJG XM-3820 Live
        camera_image: camera.wjg_xm_3820
        camera_view: live        # Nutzt RTSP via HA Stream
        entities:
          - entity: binary_sensor.wjg_xm_3820_bewegung
            icon: mdi:motion-sensor
          - entity: switch.wjg_xm_3820_aufnahme
            icon: mdi:record-circle

      # ───────────────────────────────────────────────
      # 2) STATUS-KARTEN (mittlere Reihe)
      # ───────────────────────────────────────────────
      - type: horizontal-stack
        cards:
          - type: entity
            entity: switch.wjg_xm_3820_aufnahme
            name: Aufnahme
            icon: mdi:record-circle
            state_color: true
            tap_action:
              action: toggle

          - type: entity
            entity: binary_sensor.wjg_xm_3820_bewegung
            name: Bewegung
            icon: mdi:motion-sensor
            state_color: true

          - type: entity
            entity: camera.wjg_xm_3820
            name: Kamera-Status
            attribute: protocol
            icon: mdi:camera

      # ───────────────────────────────────────────────
      # 3) PTZ-STEUERUNG
      # ───────────────────────────────────────────────
      - type: grid
        title: PTZ-Steuerung
        columns: 3
        square: false
        cards:
          - type: button
            icon: mdi:arrow-up-bold-circle
            tap_action:
              action: call-service
              service: button.press
              service_data:
                entity_id: button.wjg_xm_3820_ptz_up
          - type: button
            icon: mdi:arrow-left-bold-circle
            tap_action:
              action: call-service
              service: button.press
              service_data:
                entity_id: button.wjg_xm_3820_ptz_left
          - type: button
            icon: mdi:arrow-right-bold-circle
            tap_action:
              action: call-service
              service: button.press
              service_data:
                entity_id: button.wjg_xm_3820_ptz_right
          - type: button
            icon: mdi:arrow-down-bold-circle
            tap_action:
              action: call-service
              service: button.press
              service_data:
                entity_id: button.wjg_xm_3820_ptz_down
          - type: button
            icon: mdi:magnify-plus
            tap_action:
              action: call-service
              service: button.press
              service_data:
                entity_id: button.wjg_xm_3820_ptz_zoom_in
          - type: button
            icon: mdi:magnify-minus
            tap_action:
              action: call-service
              service: button.press
              service_data:
                entity_id: button.wjg_xm_3820_ptz_zoom_out

      # ───────────────────────────────────────────────
      # 4) SCHNELLAKTIONEN
      # ───────────────────────────────────────────────
      - type: horizontal-stack
        cards:
          - type: button
            name: Aufnahme starten
            icon: mdi:record
            tap_action:
              action: call-service
              service: switch.turn_on
              service_data:
                entity_id: switch.wjg_xm_3820_aufnahme

          - type: button
            name: Aufnahme stoppen
            icon: mdi:stop
            tap_action:
              action: call-service
              service: switch.turn_off
              service_data:
                entity_id: switch.wjg_xm_3820_aufnahme

          - type: button
            name: Snapshot
            icon: mdi:camera-iris
            tap_action:
              action: call-service
              service: camera.snapshot
              service_data:
                entity_id: camera.wjg_xm_3820
                filename: "/config/www/snapshots/wjg_{{ now().strftime('%Y%m%d_%H%M%S') }}.jpg"

      # ───────────────────────────────────────────────
      # 5) LOG / EREIGNISSE
      # ───────────────────────────────────────────────
      - type: logbook
        title: Kamera-Ereignisse
        hours_to_show: 24
        entities:
          - camera.wjg_xm_3820
          - switch.wjg_xm_3820_aufnahme
          - binary_sensor.wjg_xm_3820_bewegung

  # ──────────────────────────────────────────────────
  # TAB 2: Aufnahmen / Dateien
  # ──────────────────────────────────────────────────
  - title: Aufnahmen
    path: aufnahmen
    icon: mdi:folder-play
    cards:
      - type: entities
        title: Dateiliste / SD-Karte
        entities:
          - entity: sensor.wjg_xm_3820_dateiliste
            name: Anzahl Dateien

      - type: history-graph
        title: Aufnahme-Aktivität (24h)
        entities:
          - entity: switch.wjg_xm_3820_aufnahme
        hours_to_show: 24
        refresh_interval: 60

  # ──────────────────────────────────────────────────
  # TAB 3: Einstellungen / Netzwerk
  # ──────────────────────────────────────────────────
  - title: Einstellungen
    path: einstellungen
    icon: mdi:cog-outline
    cards:
      - type: entities
        title: Kamera-Verbindung
        entities:
          - entity: camera.wjg_xm_3820
            attribute: host
            name: IP-Adresse
            icon: mdi:ip-network
          - entity: camera.wjg_xm_3820
            attribute: protocol
            name: Protokoll
            icon: mdi:protocol
          - entity: camera.wjg_xm_3820
            attribute: rtsp_url
            name: RTSP-URL
            icon: mdi:video-wireless

      - type: button
        name: Integration neu laden
        icon: mdi:refresh
        tap_action:
          action: call-service
          service: homeassistant.reload_config_entry
          service_data:
            entry_id: "{{ config_entry_id }}"
