- id: '1777301668452'
  alias: Kühlschrank Steuerung PRO (Tasmota Smart)
  description: ''
  triggers:
  - event: start
    trigger: homeassistant
  actions:
  - repeat:
      while: []
      sequence:
      - variables:
          temp: '{{ state_attr(''weather.forecast_home'', ''temperature'') | float(15)
            }}'
          is_day: '{{ now().hour >= 6 and now().hour < 22 }}'
      - wait_template: "{{ (as_timestamp(now()) - as_timestamp(states.switch.tm_kuhlschrank.last_changed)) > 600 }}"
      - choose:
        - conditions:
          - condition: template
            value_template: '{{ temp < 10 }}'
          sequence:
          - variables:
              an: "{{ states('input_number.ks_kalt_an_tag')|int(60) if is_day\n   else
                states('input_number.ks_kalt_an_nacht')|int(60) }}\n"
              aus: "{{ states('input_number.ks_kalt_aus_tag')|int(120) if is_day\n   else
                states('input_number.ks_kalt_aus_nacht')|int(120) }}\n"
        - conditions:
          - condition: template
            value_template: '{{ temp >= 10 and temp <= 20 }}'
          sequence:
          - variables:
              an: "{{ states('input_number.ks_mild_an_tag')|int(90) if is_day\n   else
                states('input_number.ks_mild_an_nacht')|int(90) }}\n"
              aus: "{{ states('input_number.ks_mild_aus_tag')|int(90) if is_day\n   else
                states('input_number.ks_mild_aus_nacht')|int(90) }}\n"
        - conditions:
          - condition: template
            value_template: '{{ temp > 20 }}'
          sequence:
          - variables:
              an: "{{ states('input_number.ks_heiss_an_tag')|int(120) if is_day\n   else
                states('input_number.ks_heiss_an_nacht')|int(120) }}\n"
              aus: "{{ states('input_number.ks_heiss_aus_tag')|int(60) if is_day\n   else
                states('input_number.ks_heiss_aus_nacht')|int(60) }}\n"
      - target:
          entity_id: switch.tm_kuhlschrank
        action: switch.turn_on
      - wait_template: "{{ states('sensor.tm_kuhlschrank_energy_power') | float(0) > 50 }}"
        timeout: 00:10:00
        continue_on_timeout: true
      - wait_template: "{{ states('sensor.tm_kuhlschrank_energy_power') | float(0) < 25 }}"
        timeout: 03:00:00
        continue_on_timeout: true
      - target:
          entity_id: switch.tm_kuhlschrank
        action: switch.turn_off
      - delay:
          minutes: '{{ aus }}'
  mode: single
